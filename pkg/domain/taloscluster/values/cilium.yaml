# Default Cilium install values — see ciliumValues' own doc in addons.go
# for why each of these diverges from the chart's own defaults. Merged
# with (and overridden by) any user-supplied spec.addons.cilium.values —
# see mergeValues in addons.go.
kubeProxyReplacement: true
k8sServiceHost: localhost
# k8sServicePort is set at runtime from kubePrismPort (config.go) — see
# ciliumValues, which overlays it onto what's loaded from this file.
envoy:
  enabled: true
l2announcements:
  enabled: true
nodeIPAM:
  enabled: true
operator:
  replicas: 1
ipam:
  mode: kubernetes
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
