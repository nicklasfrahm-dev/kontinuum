# Default Cilium install — chart identity/version, namespace, and Helm
# values all live together here so there's one place to update when e.g.
# bumping a chart version. The release/chart name itself defaults to this
# file's own name ("cilium") — see resolveAddon in addons.go. values are
# merged with (and overridden by) any user-supplied spec.addons[].values
# for an entry named "cilium" — see mergeValues in addons.go. Every value
# below diverges from the chart's own default for a reason — see this
# package's own doc — following Talos's own documented Cilium install
# (docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium). Fields
# marked $cel are computed at reconcile time — see celvalues.go's own doc
# for the ctx variable they evaluate against.
chart:
  repo: https://helm.cilium.io
  version: 1.16.5
namespace: kube-system
values:
  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort:
    $cel: "ctx.talos.kubePrism.port"
  envoy:
    enabled: true
  gatewayAPI:
    enabled: true
  l2announcements:
    enabled: true
  nodeIPAM:
    enabled: true
  operator:
    # A second replica could never even schedule on a single-node cluster
    # (hostNetwork: true means a port collision) — scale up only once
    # there's more than one control-plane node to spread across.
    replicas:
      $cel: "ctx.taloscluster.status.controlPlane.replicas > 1 ? 2 : 1"
  ipam:
    mode: kubernetes
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
