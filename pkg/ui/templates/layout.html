<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Kontinuum</title>
    <link rel="stylesheet" href="/static/vendor/jetbrains-mono.css">
    <script src="/static/vendor/tailwindcss.js"></script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/prism-core.min.js"></script>
    <script src="/static/vendor/prism-yaml.min.js"></script>
    <script src="/static/vendor/prism-bash.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: '#E0924F'
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        html {
            /* Always reserve the scrollbar gutter so pages that grow past
               the viewport (e.g. revealing the kubeconfig block) don't
               shift the layout width when the scrollbar appears. */
            overflow-y: scroll;
            scrollbar-width: thin;
            scrollbar-color: #404040 transparent;

            /* The webkit scrollbar's track paints against html's own
               background, not body's — duplicated here (not just on body)
               so a "transparent" track (below) shows this gradient instead
               of a flat black edge. */
            background-color: #0a0a0a;
            background-image: radial-gradient(at 15% 8%, rgba(255,255,255,0.04) 0px, transparent 45%),
                               radial-gradient(at 85% 92%, rgba(255,255,255,0.03) 0px, transparent 40%);
            background-attachment: fixed;
        }

        body {
            background-image: radial-gradient(at 15% 8%, rgba(255,255,255,0.04) 0px, transparent 45%),
                               radial-gradient(at 85% 92%, rgba(255,255,255,0.03) 0px, transparent 40%);
            background-attachment: fixed;
        }

        ::selection {
            background: rgb(224 146 79 / 35%);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #404040;
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #525252;
        }

        /* Prism ships no theme of its own here — only prism-core plus the
           yaml/bash grammars are vendored (see pkg/ui/assets.go), which
           just assign "token" classes with no styling attached. This block
           is the only source of syntax-highlighting color/layout in the
           app; there's no upstream theme stylesheet to fight with, so
           nothing here needs !important. */
        pre[class*="language-"],
        code[class*="language-"] {
            background: transparent;
            font-family: inherit;
            /* Pinned to Tailwind's text-xs value directly, rather than
               relying on inheritance, so it stays fixed regardless of
               where a code block is nested. */
            font-size: 0.75rem;
            line-height: 1rem;
            margin: 0;
            padding: 0;
            color: #f5f5f5;
        }

        /* Structural/muted tokens (comments, punctuation) — dimmed to
           neutral-500, the same muted color the rest of the UI uses for
           secondary text (e.g. the descriptions under each page
           heading). */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata,
        .token.punctuation {
            color: #737373;
        }

        /* "Value" tokens (strings, numbers, keywords, ...) — colored with
           the site's accent (see tailwind.config's `accent` above) so
           emphasized code ties back to the same brand color used for CTAs
           elsewhere. Everything else (plain text, property/function/tag
           names, ...) is intentionally left unstyled: with no competing
           theme rule, it just inherits the base neutral-100 above. */
        .token.tag,
        .token.operator,
        .token.number,
        .token.boolean,
        .token.string,
        .token.entity,
        .token.url,
        .token.attr-value,
        .token.keyword,
        .token.control,
        .token.directive,
        .token.unit,
        .token.statement,
        .token.regex,
        .token.atrule,
        .token.placeholder,
        .token.variable,
        .token.important {
            color: #E0924F;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-mono" hx-boost="true">
    <!-- Deliberately above the page content block below, not after it: a
         page's own inline <script> runs at parse time, so any content
         rendered ahead of these definitions throws ReferenceError on a hard
         page load — and takes the rest of that script block down with it —
         the moment it calls wireCopyChip at top level, which every
         delete-confirmation modal in the app does. hx-boost masked this,
         since a boosted navigation swaps the body after these have already
         run once, so it only ever broke on a direct load or refresh.
         Nothing here touches the DOM at definition time: every element
         lookup happens inside a function body, called long after the
         document has finished parsing, so running first costs nothing.
         Keep this block ahead of the content. -->
    <script>
        // wireCopyChip(chip, value) wires up chip's (any "copy-chip"
        // instance — see that template's own doc) click-to-copy/"Copied"
        // feedback behavior. value is copied as-is, or — for a chip a
        // shared, per-row-retargeted dialog re-populates after this runs
        // (see instances_content.html's own openDeleteInstanceModal,
        // registry_content.html's own openZoneLeaveModal) — a function
        // returning the current value, called fresh on every click
        // rather than captured once up front. Global (not page-specific)
        // so every page's own script block can wire up its own static
        // copy-chip usages (see instance_detail_content.html) through
        // this one definition instead of each hand-rolling the same
        // listener.
        function wireCopyChip(chip, value) {
            var copiedFeedback = chip.querySelector('[data-copied-feedback]');

            chip.addEventListener('click', function () {
                var text = typeof value === 'function' ? value() : value;

                navigator.clipboard.writeText(text).then(function () {
                    copiedFeedback.classList.remove('hidden');
                    copiedFeedback.classList.add('flex');

                    window.setTimeout(function () {
                        copiedFeedback.classList.add('hidden');
                        copiedFeedback.classList.remove('flex');
                    }, 1500);
                });
            });
        }

        // buildCopyChip(value) clones the copy-chip-shell template below,
        // populates it, and wires it up via wireCopyChip — used where a
        // chip's own
        // value isn't known until entirely client-side (showToast's own
        // message), unlike every other copy-chip usage in the app, which
        // renders server-side and only needs wireCopyChip directly.
        function buildCopyChip(value) {
            var chip = document.getElementById('copy-chip-shell').content.cloneNode(true).firstElementChild;

            chip.querySelector('[data-name-text]').textContent = value;
            wireCopyChip(chip, value);

            return chip;
        }

        // showToast(prefix, command, suffix) appends a dismissable toast to
        // #toast-container and auto-removes it after toastDuration — global
        // (defined here in layout.html, not a page-specific script block)
        // so any page's own htmx-driven success handling can call it
        // without needing its own container/markup. command is rendered as
        // a click-to-copy chip (see buildCopyChip) between the plain-text
        // prefix/suffix; pass an empty command for a plain-text-only toast.
        // toastDuration is long enough to read a full sentence plus an
        // inline command, not just a short label. Every toast today is a
        // success confirmation (the checkmark is baked in, not
        // conditional) — revisit if/when a non-success toast is ever
        // needed.
        var toastDuration = 8000;

        function showToast(prefix, command, suffix) {
            var container = document.getElementById('toast-container');
            var toast = document.createElement('div');
            toast.className = 'pointer-events-auto flex items-start gap-3 bg-neutral-900 border border-emerald-500/30 ' +
                'rounded-xl px-4 py-3 text-sm text-neutral-100 shadow-lg max-w-sm opacity-0 translate-y-2 ' +
                'transition-all duration-200';

            var iconTemplate = document.getElementById('toast-check-icon');
            toast.appendChild(iconTemplate.content.cloneNode(true));

            var text = document.createElement('span');
            text.className = 'flex-1';
            text.appendChild(document.createTextNode(prefix));
            if (command) {
                text.appendChild(buildCopyChip(command));
            }
            if (suffix) {
                text.appendChild(document.createTextNode(suffix));
            }
            toast.appendChild(text);

            var dismiss = document.createElement('button');
            dismiss.type = 'button';
            dismiss.setAttribute('aria-label', 'Dismiss');
            dismiss.className = 'shrink-0 text-neutral-500 hover:text-white transition-colors leading-none';
            dismiss.textContent = '×';

            var timeoutId = window.setTimeout(function () { removeToast(toast); }, toastDuration);
            dismiss.addEventListener('click', function () {
                window.clearTimeout(timeoutId);
                removeToast(toast);
            });

            toast.appendChild(dismiss);
            container.appendChild(toast);

            // Force a reflow so the opacity/translate transition below
            // actually animates from the classes set above, rather than
            // starting already in its final state.
            void toast.offsetWidth;
            toast.classList.remove('opacity-0', 'translate-y-2');
        }

        function removeToast(toast) {
            toast.classList.add('opacity-0');
            window.setTimeout(function () { toast.remove(); }, 200);
        }

        // Page-loading feedback for hx-boost navigations. Every page
        // renders server-side against the database, so on a slow round
        // trip a clicked link otherwise looks like it did nothing until
        // the whole response arrives. While a boosted GET (a link click,
        // or a history restore that missed htmx's cache) is in flight,
        // #page-progress (hx-preserve'd, so it survives the body swap and
        // can animate to completion) creeps toward the right edge and
        // <main> is marked aria-busy, which dims the current content and
        // shows #page-loading-spinner via Tailwind's group-aria-busy
        // variant. Both only appear after pageLoadingDelay, so a fast
        // navigation never flashes them. Boosted form submits are left
        // alone: their own buttons already carry a spinner (see
        // AGENTS.md's UI policy), and polling requests aren't boosted.
        var pageLoadingDelay = 150;

        function startPageLoading() {
            window.clearTimeout(window.pageLoadingTimer);
            window.pageLoadingTimer = window.setTimeout(function () {
                var bar = document.getElementById('page-progress');
                var main = document.querySelector('main');

                bar.style.transition = 'none';
                bar.style.width = '0%';
                bar.style.opacity = '1';
                // Force a reflow so the creep below animates from 0%.
                void bar.offsetWidth;
                bar.style.transition = 'width 8s cubic-bezier(0.1, 0.6, 0.3, 1)';
                bar.style.width = '85%';

                main.setAttribute('aria-busy', 'true');
            }, pageLoadingDelay);
        }

        function stopPageLoading() {
            window.clearTimeout(window.pageLoadingTimer);

            var bar = document.getElementById('page-progress');
            var main = document.querySelector('main');

            // A successful swap already replaced <main> with a fresh,
            // non-busy one; this only matters after an error, where the
            // old page stays put and must become interactive again.
            main.removeAttribute('aria-busy');

            if (bar.style.opacity !== '1') {
                return;
            }

            bar.style.transition = 'width 200ms ease-out, opacity 300ms ease 200ms';
            bar.style.width = '100%';
            bar.style.opacity = '0';
        }

        function isBoostedNavigation(evt) {
            return evt.detail.boosted && evt.detail.requestConfig && evt.detail.requestConfig.verb === 'get';
        }

        // hx-boost swaps the whole <body>, re-running this script on every
        // navigation, so the document-level listeners are only attached
        // once.
        if (!window.pageLoadingWired) {
            window.pageLoadingWired = true;

            document.addEventListener('htmx:beforeRequest', function (evt) {
                if (isBoostedNavigation(evt)) {
                    startPageLoading();
                }
            });
            document.addEventListener('htmx:afterRequest', function (evt) {
                if (isBoostedNavigation(evt)) {
                    stopPageLoading();
                }
            });
            document.addEventListener('htmx:historyCacheMiss', startPageLoading);
            document.addEventListener('htmx:historyCacheMissLoad', stopPageLoading);
            document.addEventListener('htmx:historyCacheMissLoadError', stopPageLoading);
        }
    </script>

    <div id="page-progress" hx-preserve="true" role="presentation"
         class="fixed top-0 left-0 z-[60] h-0.5 bg-accent shadow-[0_0_8px_#E0924F] pointer-events-none"
         style="width: 0%; opacity: 0;"></div>

    {{template "nav" .}}

    <main class="group pt-20 lg:pt-8 lg:ml-64 min-h-screen px-4 pb-6 lg:px-8 lg:pb-8 aria-busy:pointer-events-none">
        <div class="max-w-screen-2xl mx-auto w-full transition-opacity duration-200 group-aria-busy:opacity-40">
            {{block "content" .}}{{end}}
        </div>
        <div id="page-loading-spinner" aria-hidden="true"
             class="fixed inset-0 lg:left-64 z-20 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200 group-aria-busy:opacity-100">
            <span class="text-accent animate-spin motion-reduce:animate-none [&>svg]:h-8 [&>svg]:w-8">{{template "icon-loader-circle"}}</span>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <!-- Pre-rendered once, server-side, and cloned per toast by showToast —
         reuses the same icon-check component the rest of the app already
         uses for success/copied confirmations, rather than hand-writing SVG
         path data in JS. -->
    <template id="toast-check-icon">
        <span class="text-emerald-400 shrink-0 mt-0.5 [&>svg]:h-4 [&>svg]:w-4">{{template "icon-check"}}</span>
    </template>
    <!-- Cloned by buildCopyChip above — the exact same "copy-chip"
         component zone_leave_modal.html's own name chips render
         server-side (see that template's own doc for why this exists:
         two chips built from what looked like identical hand-written
         classes still rendered at different heights before it did),
         just instantiated once here, empty, for JS to clone per toast
         rather than re-declaring the same markup a second time. -->
    <template id="copy-chip-shell">{{template "copy-chip" (dict)}}</template>
</body>
</html>
