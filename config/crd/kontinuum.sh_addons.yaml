---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: addons.kontinuum.sh
spec:
  group: kontinuum.sh
  names:
    kind: Addon
    listKind: AddonList
    plural: addons
    singular: addon
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.talosClusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Addon represents one addon belonging to a TalosCluster, installed and
          health-probed by pkg/domain/addon's own AddonReconciler — an
          independent, owned resource: TalosCluster's own reconciler only seeds
          the two built-ins (see pkg/domain/addon's EnsureBuiltinSeeds) and
          aggregates Ready across whatever Addons reference it, built-in or
          fully custom alike.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AddonSpec configures one addon. Enabled is a pointer, not a plain bool,
              so a hand-built Go value (e.g. a unit test's fake-client object, which
              bypasses CRD admission defaulting) can still distinguish "unset" from
              "explicitly false" — nil is treated as enabled, matching the effective
              behavior +kubebuilder:default=true gives any real Create/Update through
              the apiserver.
            properties:
              chart:
                description: |-
                  Chart identifies the Helm chart to install. Optional for the
                  built-in addons, whose own default applies unless overridden here;
                  required for any other ReleaseName.
                properties:
                  name:
                    description: Name is the chart's own name within Repo.
                    maxLength: 63
                    type: string
                  repo:
                    description: Repo is the Helm chart repository URL.
                    maxLength: 256
                    type: string
                  version:
                    description: Version pins the chart version to install.
                    maxLength: 32
                    type: string
                type: object
              enabled:
                default: true
                description: |-
                  Enabled controls whether this addon is installed at all. Defaults to
                  true; set to false when something else (e.g. ArgoCD) already owns
                  this addon's lifecycle.
                type: boolean
              lifecycle:
                description: |-
                  AddonLifecycleSpec configures how an addon is provisioned and, in the
                  future, kept up to date.
                properties:
                  priority:
                    default: 100
                    description: |-
                      Priority controls install ordering relative to this addon's own
                      cluster's other addons — addons install in ascending priority
                      "waves": every enabled addon at a lower priority must be Ready
                      before a higher-priority one starts installing, while addons
                      sharing the same priority install fully in parallel, same as if
                      this field didn't exist. Defaults to 100. Lower it for a
                      prerequisite addon other addons' own charts assume already exists
                      (e.g. a CRD-only chart another chart's templates reference) —
                      see the built-in gateway-api-crds addon, which installs at a lower
                      priority than cilium/cert-manager for exactly this reason.
                    format: int32
                    type: integer
                  provisioning:
                    description: AddonProvisioningSpec configures how an addon's manifests
                      are applied.
                    properties:
                      method:
                        default: HelmUpgradeInstall
                        description: Method selects HelmUpgradeInstall (the default)
                          or KubectlApply.
                        enum:
                        - HelmUpgradeInstall
                        - KubectlApply
                        type: string
                    type: object
                type: object
              namespace:
                description: Namespace configures the namespace this addon installs
                  into.
                properties:
                  name:
                    description: |-
                      Name is the namespace's own name. Empty means the built-in's own
                      default (see AddonSpec.ReleaseName's own doc) or an error (for any
                      other ReleaseName).
                    type: string
                type: object
              releaseName:
                description: |-
                  ReleaseName identifies this addon — also its Helm release name.
                  Defaults to this Addon's own metadata.name when unset (see
                  addon.ReleaseName in pkg/domain/addon). "cilium" and "cert-manager"
                  are built-in: leaving Chart/Namespace/Values unset falls back to
                  this addon's own embedded defaults — see resolveAddon in
                  pkg/domain/addon. Any other ReleaseName has no built-in fallback —
                  Chart must be set.
                maxLength: 63
                type: string
              talosClusterRef:
                description: TalosClusterRef names the TalosCluster this addon belongs
                  to.
                properties:
                  name:
                    description: Name is the referenced TalosCluster's name.
                    type: string
                required:
                - name
                type: object
              values:
                description: |-
                  Values are user-provided Helm values, merged on top of Kontinuum's
                  own required values for this addon — user values win on conflict.
                  Free-form (not a typed struct) since chart values vary per addon and
                  per chart version.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - talosClusterRef
            type: object
          status:
            description: AddonStatus reports one addon's install/health state.
            properties:
              conditions:
                description: Conditions reports this addon's state, e.g. Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - metadata
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.talosClusterRef.name
    served: true
    storage: true
    subresources:
      status: {}
