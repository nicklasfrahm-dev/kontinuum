---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: kontinuums.kontinuum.sh
spec:
  group: kontinuum.sh
  names:
    kind: Kontinuum
    listKind: KontinuumList
    plural: kontinuums
    singular: kontinuum
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Kontinuum represents a single running kontinuum process registered in the
          central server registry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KontinuumSpec describes a single running kontinuum process.
            properties:
              region:
                description: Region is the region this process manages. Empty when
                  Role is RoleControlPlane.
                type: string
              role:
                description: Role is either RoleControlPlane or RoleWorker.
                enum:
                - ControlPlane
                - Worker
                type: string
              zone:
                description: Zone is the availability zone this process manages. Empty
                  when Role is RoleControlPlane.
                type: string
            required:
            - role
            type: object
            x-kubernetes-validations:
            - message: region and zone must both be set, or both be empty
              rule: (!has(self.region) || self.region == '') == (!has(self.zone) ||
                self.zone == '')
          status:
            description: |-
              KontinuumStatus reports the last time a Kontinuum reported in.
              LastHeartbeatTime is +optional despite lacking omitempty: with the
              status subresource enabled (see the +kubebuilder:subresource:status
              marker below), the apiserver always strips whatever status the main
              resource endpoint's Create/Update payload carries before validating it —
              status is only ever populated afterward, via the status subresource.
              Requiring this field would make every Create fail structural-schema
              validation against that always-empty status.
            properties:
              lastHeartbeatTime:
                description: |-
                  LastHeartbeatTime is when this process last reported in. The server
                  registry deletes a Kontinuum whose LastHeartbeatTime is older than
                  its configured stale threshold (5 minutes by default).
                format: date-time
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .status.role
      name: Role
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Kontinuum represents a single running kontinuum process registered in the
          central server registry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KontinuumSpec describes a single running kontinuum process.
            properties:
              region:
                description: |-
                  Region is the region this process manages. Empty when both Region and
                  Zone are empty, in which case the process is the control-plane entrypoint.
                type: string
              zone:
                description: |-
                  Zone is the availability zone this process manages. Empty when both
                  Region and Zone are empty, in which case the process is the
                  control-plane entrypoint.
                type: string
            type: object
            x-kubernetes-validations:
            - message: region and zone must both be set, or both be empty
              rule: (!has(self.region) || self.region == '') == (!has(self.zone) ||
                self.zone == '')
          status:
            description: |-
              KontinuumStatus reports the last time a Kontinuum reported in. Every
              field is +optional despite lacking omitempty: with the status subresource
              enabled (see the +kubebuilder:subresource:status marker below), the
              apiserver always strips whatever status the main resource endpoint's
              Create/Update payload carries before validating it — status is only ever
              populated afterward, via the status subresource. Requiring these fields
              would make every Create fail structural-schema validation against that
              always-empty status.
            properties:
              config:
                description: |-
                  Config is this process's own non-confidential configuration, shown on
                  its per-instance settings page (/app/kontinuums/{name}). It is in fact
                  pkg/config.Config itself: Server/Log/OIDC below are the very types
                  pkg/config.Config's own fields are declared with (see that package),
                  so there is exactly one definition of each shape, not two that could
                  drift apart, and a value read here maps 1:1 onto the env vars that
                  produced it. The one accepted duplication is Region/Zone, which also
                  live on KontinuumSpec — harmless, and it's what keeps the mapping
                  exact rather than Server needing an asterisk. Storage here is always
                  the credential-stripped display copy (see pkg/config.RedactStorage) —
                  never the raw, connectable value pkg/config.Config.Server.Storage
                  holds before that redaction — see pkg/cli/serve.go's displayConfig,
                  the one place that redaction happens.
                properties:
                  acme:
                    description: |-
                      KontinuumACMEConfigStatus is pkg/config's ACME.Email/ACME.Server —
                      non-confidential, so (like Server/Log/OIDC) it's safe to show on every
                      registered Kontinuum's own status.config. Used by pkg/domain/zone when
                      creating a joined zone's cert-manager ClusterIssuer.
                    properties:
                      email:
                        description: |-
                          Email is the ACME account email used when creating a zone's
                          cert-manager ClusterIssuer.
                        type: string
                      server:
                        description: |-
                          Server is the ACME directory URL. Defaults to Let's Encrypt
                          production, not staging.
                        type: string
                    type: object
                  insecureAllowAnonymous:
                    description: |-
                      InsecureAllowAnonymous must be explicitly set to "true" to start the
                      server with no OIDC issuer configured — see
                      pkg/config.Config.ValidateAuthentication, which refuses to start
                      otherwise. Mutually exclusive with OIDC.IssuerURL being set.
                    type: string
                  log:
                    description: |-
                      KontinuumLogConfigStatus is pkg/config.LogConfig, referenced directly by
                      that package rather than redefined — see pkg/config.Config.Log.
                    properties:
                      format:
                        description: 'Format is one of: console, text, json.'
                        type: string
                      level:
                        description: 'Level is one of: debug, info, warn, error.'
                        type: string
                    type: object
                  oidc:
                    description: |-
                      KontinuumOIDCConfigStatus is pkg/config.OIDCConfig, referenced directly
                      by that package rather than redefined — see pkg/config.Config.OIDC.
                      Enabled has no `default` tag: pkg/config.Load never sets it directly
                      (its string-only field walk skips bool fields entirely), it's always
                      derived as IssuerURL != "" — see pkg/cli/serve.go's displayConfig.
                    properties:
                      adminGroups:
                        description: |-
                          AdminGroups is a comma-delimited list of OIDC groups granted full
                          access. Empty when Enabled is false.
                        type: string
                      clientID:
                        description: |-
                          ClientID is the OAuth 2.0 public client ID registered with the
                          issuer.
                        type: string
                      enabled:
                        description: Enabled is true when this process has OIDC authentication
                          configured.
                        type: boolean
                      issuerURL:
                        description: IssuerURL is the OIDC issuer URL. Empty when
                          Enabled is false.
                        type: string
                      redirectURL:
                        description: RedirectURL is the browser login flow's callback
                          URL.
                        type: string
                    type: object
                  server:
                    description: |-
                      KontinuumServerConfigStatus is pkg/config.ServerConfig, referenced
                      directly by that package rather than redefined — see
                      pkg/config.Config.Server. Region/Zone duplicate KontinuumSpec's own
                      fields — see KontinuumStatus.Config's doc for why that's accepted.
                    properties:
                      addr:
                        description: Addr is the listener address this process is
                          serving on.
                        type: string
                      dns:
                        description: |-
                          KontinuumDNSConfigStatus groups DNS-related server config under its own
                          namespace, room to grow beyond just Domain later without crowding
                          KontinuumServerConfigStatus itself.
                        properties:
                          credential:
                            description: |-
                              Credential is this provider's own credential, in that provider's own
                              native format (an API token, an access/secret key pair, a JSON config
                              blob — whatever that provider expects; kontinuum defines no encoding
                              of its own for it — see issue #51's own architecture). Confidential:
                              unlike Domain/Provider, this is never populated here — Config.Redact
                              always strips it before a value reaches status.config, and the raw
                              original instead lives in the Secret KontinuumStatus.SecretRef points
                              to, extending storageSecretKey's own convention. Tagged
                              `secret:"true"` for the same reason as Storage's own identical tag
                              (see that field's own doc) — without it, pkg/domain/zone's ensureEnv
                              would copy this into a joined zone's broadly-readable ConfigMap
                              instead of its Secret.
                            type: string
                          domain:
                            description: |-
                              Domain is the base domain a zone's own kontinuum-server is published
                              under (<zone>.<region>.<domain> — see ZoneSpec.Domain's own doc). Not
                              confidential, so — unlike Storage — it's published here directly
                              rather than through the Secret KontinuumStatus.SecretRef points to:
                              pkg/domain/zone's Add fan-out infers a new zone's own domain from
                              this same field on any already-registered Kontinuum, exactly
                              mirroring how it infers Storage from that Secret.
                            type: string
                          provider:
                            description: |-
                              Provider selects the external-dns provider a zone's own DNS record is
                              managed through (e.g. "route53", "azure", "cloudflare") — passed
                              through untouched to whatever external-dns Addon the operator
                              configures for it (see pkg/domain/addon/values/external-dns.yaml's own
                              doc for why kontinuum doesn't wire this in itself). Not confidential,
                              so — like Domain — it's published here directly. Empty means no DNS
                              provider is configured; see pkg/domain/zone's own doc for what that
                              means for a Zone's own DNSEndpoint management.
                            type: string
                        type: object
                      grpc:
                        description: |-
                          KontinuumGRPCConfigStatus groups this process's own etcd gRPC proxy
                          config (see pkg/domain/etcdproxy) under its own namespace, same
                          rationale as KontinuumDNSConfigStatus.
                        properties:
                          endpoint:
                            description: |-
                              Endpoint is this hub's own publicly reachable "host:port" for its
                              etcd gRPC proxy (see pkg/domain/etcdproxy.RegisterHub) — multiplexed
                              onto the same port as everything else this process serves, so this
                              is normally the same host:port a browser reaches /app on. Not
                              confidential, so — like DNS.Domain — it's published here directly:
                              pkg/domain/zone's own Reconciler reads this off the hub's own
                              config (not by inferring it from another registered Kontinuum, the
                              way Storage/DNS.Domain are — every registered Kontinuum could be a
                              different zone's own downstream instance, each reachable at a
                              different address, so only the operator-configured value on this
                              specific hub process is trustworthy here) to build a newly joined
                              zone's own KONTINUUM_SERVER_STORAGE.
                            type: string
                          insecureTLSSkipVerify:
                            description: |-
                              InsecureTLSSkipVerify skips TLS certificate verification on the
                              connection a joined zone's own etcdproxy.Relay makes back to
                              Endpoint — for local development only, where Endpoint terminates TLS
                              with a self-signed certificate no client trusts by default (see
                              compose.yaml's own proxy service). A real deployment's Endpoint is
                              expected to present a certificate the zone's own root CA set already
                              trusts, the same as every other kind of traffic the hub serves.
                            type: string
                        type: object
                      region:
                        description: Region duplicates spec.region — see this type's
                          own doc.
                        type: string
                      storage:
                        description: |-
                          Storage is the storage connection string with any embedded
                          credentials stripped (see pkg/config.RedactStorage). The
                          credential-bearing original lives in the Secret
                          KontinuumStatus.SecretRef points to. Tagged `secret:"true"` — not a
                          kubebuilder marker, just consulted by pkg/config.Config.EnvVars —
                          so pkg/domain/zone routes a joined zone's own copy of this env var
                          into its Secret rather than its broadly-readable ConfigMap.
                        type: string
                      zone:
                        description: Zone duplicates spec.zone — see this type's own
                          doc.
                        type: string
                    type: object
                type: object
              lastHeartbeatTime:
                description: |-
                  LastHeartbeatTime is when this process last reported in. The server
                  registry deletes a Kontinuum whose LastHeartbeatTime is older than
                  its configured stale threshold (5 minutes by default).
                format: date-time
                type: string
              role:
                description: |-
                  Role is either RoleControlPlane or RoleWorker, derived from
                  spec.region and spec.zone — see registry.Role.
                enum:
                - ControlPlane
                - Worker
                type: string
              secretRef:
                description: |-
                  SecretRef points to the Secret holding this process's confidential
                  configuration (storage connection string and any other credentials) —
                  see KontinuumSecretReference. It is never inlined into status
                  directly: unlike spec/status, a Secret's RBAC can be restricted
                  independently of who can read this broadly-visible Kontinuum object.
                properties:
                  name:
                    description: Name is the Secret's name.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Secret's namespace. Defaults to
                      KontinuumSystemNamespace.
                    type: string
                type: object
              version:
                description: Version is this process's build version.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
