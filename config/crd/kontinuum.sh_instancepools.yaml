---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: instancepools.kontinuum.sh
spec:
  group: kontinuum.sh
  names:
    kind: InstancePool
    listKind: InstancePoolList
    plural: instancepools
    singular: instancepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.conditions[?(@.type=="InsufficientCapacity")].status
      name: InsufficientCapacity
      type: string
    - jsonPath: .status.conditions[?(@.type=="InsufficientCapacity")].reason
      name: Reason
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          InstancePool claims (and optionally creates) a set of Instance objects to
          satisfy Spec.Replicas — see issue #24's architecture decision 2/5. No
          claiming logic is implemented yet; this phase only introduces the type.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InstancePoolSpec selects candidate Instance objects to claim, and
              optionally how to create new ones when there aren't enough — see
              InstanceTemplateSpec's doc.
            properties:
              replicas:
                description: Replicas is how many Instance objects this pool tries
                  to keep claimed.
                format: int32
                type: integer
              selector:
                description: Selector matches candidate Instance objects this pool
                  claims.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              template:
                description: |-
                  Template, when set, lets this pool create new Instance objects (and
                  their backing provider object) once Selector's existing candidates
                  run out. Unset keeps this pool bare-metal-only claim behavior — see
                  this type's own doc.
                properties:
                  providerTemplateRef:
                    description: |-
                      ProviderTemplateRef points at the *Template (e.g. AWSInstanceTemplate)
                      this pool clones from when it creates a new Instance rather than
                      claiming an existing one — never a live provider object directly.
                    properties:
                      apiVersion:
                        description: APIVersion is the referenced object's apiVersion
                          (group/version).
                        type: string
                      kind:
                        description: Kind is the referenced object's kind.
                        type: string
                      name:
                        description: Name is the referenced object's name.
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    type: object
                required:
                - providerTemplateRef
                type: object
            required:
            - replicas
            - selector
            type: object
            x-kubernetes-validations:
            - message: template.providerTemplateRef is required when template is set
              rule: '!has(self.template) || has(self.template.providerTemplateRef)'
          status:
            description: |-
              InstancePoolStatus reports how many of Spec.Replicas are currently
              claimed and ready.
            properties:
              conditions:
                description: Conditions reports this pool's state, e.g. InsufficientCapacity.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              readyReplicas:
                description: |-
                  ReadyReplicas is how many claimed Instance objects are currently
                  Discovered/ready.
                format: int32
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
