---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: talosclusters.kontinuum.sh
spec:
  group: kontinuum.sh
  names:
    kind: TalosCluster
    listKind: TalosClusterList
    plural: talosclusters
    singular: taloscluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.controlPlane.poolRef.name
      name: ControlPlanePool
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          TalosCluster represents one zone's real, Talos-bootstrapped Kubernetes
          cluster — see issue #24's architecture decision 1/5. No controller is
          implemented yet; this phase only introduces the type.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TalosClusterSpec describes the control-plane and worker pools that make
              up one zone's Talos-managed Kubernetes cluster — see issue #24's
              architecture decisions 1/5 (one cluster per zone) and 3/5 (control
              plane/worker split, replica counts owned by InstancePool, not here).
            properties:
              controlPlane:
                description: |-
                  ControlPlane is this cluster's control-plane member pool. A
                  replicas: 1 InstancePool (no etcd quorum) is a valid, supported
                  configuration — not an edge case to guard against — see decision
                  3/5.
                properties:
                  kubernetes:
                    description: |-
                      Kubernetes is the Kubernetes version this pool's members run (e.g.
                      "v1.32.0"). MaxLength bounds the CEL cost estimate — see Talos's own
                      doc.
                    maxLength: 32
                    type: string
                  poolRef:
                    description: |-
                      PoolRef names the InstancePool this member sizes from — see
                      InstancePoolReference's doc for why TalosCluster never carries its
                      own replicas field.
                    properties:
                      name:
                        description: Name is the referenced InstancePool's name.
                        type: string
                    required:
                    - name
                    type: object
                  talos:
                    description: |-
                      Talos is the Talos version this pool's members run (e.g. "v1.9.0").
                      MaxLength bounds the CEL cost estimate for TalosClusterSpec's version
                      skew rule below — an unbounded string makes the apiserver reject the
                      rule outright as too expensive to evaluate, regardless of actual
                      input size.
                    maxLength: 32
                    type: string
                required:
                - poolRef
                type: object
              workers:
                description: |-
                  Workers lists this cluster's worker pools. The controller bootstraps
                  ControlPlane first and only starts reconciling Workers once the
                  control plane reports healthy — a worker attempting to join before
                  etcd exists must block, not race. MaxItems bounds the CEL cost
                  estimate for the version skew rule below, evaluated once per entry —
                  see TalosVersionSpec.Talos's doc for why an unbounded list has the
                  same problem an unbounded string does.
                items:
                  description: |-
                    TalosClusterWorkerSpec is one entry in TalosCluster.spec.workers — a
                    named worker pool, so a cluster can run more than one shape of worker
                    (e.g. a gpu pool alongside the default), each independently sized by its
                    own InstancePool.
                  properties:
                    kubernetes:
                      description: |-
                        Kubernetes is the Kubernetes version this pool's members run (e.g.
                        "v1.32.0"). MaxLength bounds the CEL cost estimate — see Talos's own
                        doc.
                      maxLength: 32
                      type: string
                    name:
                      description: |-
                        Name identifies this worker pool within the cluster (e.g. "default",
                        "gpu").
                      type: string
                    poolRef:
                      description: PoolRef names the InstancePool this worker pool
                        sizes from.
                      properties:
                        name:
                          description: Name is the referenced InstancePool's name.
                          type: string
                      required:
                      - name
                      type: object
                    talos:
                      description: |-
                        Talos is the Talos version this pool's members run (e.g. "v1.9.0").
                        MaxLength bounds the CEL cost estimate for TalosClusterSpec's version
                        skew rule below — an unbounded string makes the apiserver reject the
                        rule outright as too expensive to evaluate, regardless of actual
                        input size.
                      maxLength: 32
                      type: string
                  required:
                  - name
                  - poolRef
                  type: object
                maxItems: 32
                type: array
            required:
            - controlPlane
            type: object
            x-kubernetes-validations:
            - message: a worker pool's kubernetes version must not lead the control
                plane's, and may not trail it by more than 3 minor versions
              rule: '!has(self.workers) || self.workers.all(w, !has(w.kubernetes)
                || !has(self.controlPlane.kubernetes) || (w.kubernetes.split(''.'')[0]
                == self.controlPlane.kubernetes.split(''.'')[0] && int(self.controlPlane.kubernetes.split(''.'')[1])
                >= int(w.kubernetes.split(''.'')[1]) && int(self.controlPlane.kubernetes.split(''.'')[1])
                - int(w.kubernetes.split(''.'')[1]) <= 3))'
          status:
            description: TalosClusterStatus reports this cluster's bootstrap progress.
            properties:
              conditions:
                description: |-
                  Conditions reports this cluster's state, e.g. ControlPlaneReady,
                  Bootstrapped, Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
