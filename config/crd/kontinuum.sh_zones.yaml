---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: zones.kontinuum.sh
spec:
  group: kontinuum.sh
  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    singular: zone
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.domain
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=="Installed")].status
      name: Installed
      type: string
    - jsonPath: .status.conditions[?(@.type=="Installed")].reason
      name: Reason
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Zone represents a single availability zone — a pure identity/DNS anchor
          mapping 1:1 to exactly one TalosCluster (see issue #24's architecture
          decision 1/5: one Kubernetes cluster per zone, not per region).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ZoneSpec identifies a single availability zone: the region it belongs to,
              and the DNS domain its own kontinuum-server is published under
              (<zone>.<region>.<domain>). Unlike KontinuumSpec's region/zone — where
              both empty means control-plane — a Zone object only ever describes a
              real zone, so all three fields are required together.
            properties:
              domain:
                description: |-
                  Domain is the DNS domain this zone's kontinuum-server is published
                  under.
                type: string
              region:
                description: Region is the region this zone belongs to.
                type: string
              zone:
                description: Zone is this zone's own name within Region.
                type: string
            required:
            - domain
            - region
            - zone
            type: object
            x-kubernetes-validations:
            - message: region, zone, and domain are all required
              rule: size(self.region) > 0 && size(self.zone) > 0 && size(self.domain)
                > 0
          status:
            description: |-
              ZoneStatus reports this zone's readiness. Deliberately minimal — issue
              #24's architecture decision 4/5 considered and rejected aggregate
              capacity, single-node/HA visibility, and a networking/egress address
              here: each already has an authoritative home elsewhere (the zone's own
              InstancePool/TalosCluster status, or a future Fabric-like CRD), and
              duplicating it on Zone would just be a second copy that could drift.
            properties:
              conditions:
                description: Conditions reports this zone's readiness, e.g. ClusterReady,
                  Installed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
