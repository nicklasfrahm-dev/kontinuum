version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Excessive complexity
    - depguard
    - exhaustruct
    # Deprecated linters
    - wsl
    - gomodguard
  settings:
    gomoddirectives:
      # These replaces mirror kommodity's go.mod; they are required, not
      # discretionary — see go.mod for why.
      replace-allow-list:
        - github.com/google/cel-go
        - k8s.io/kube-controller-manager
        - k8s.io/cri-client
    ireturn:
      # runtime.Object and client.Client are Kubernetes/controller-runtime's
      # own foundational interfaces: every DeepCopyObject in the ecosystem
      # returns runtime.Object by contract, and controller-runtime's fake
      # client builder only exposes its result as client.Client/WithWatch —
      # its concrete type is unexported. authorizer.Authorizer is the same
      # shape of foundational k8s.io/apiserver interface — pkg/rbac.NewAuthorizer
      # returns k8s.io/apiserver/pkg/authorization/union.New's own result,
      # which has no exported concrete type either. Neither has a
      # concrete-type alternative.
      allow:
        - error
        - empty
        - stdlib
        - runtime\.Object
        - client\.Client
        - authorizer\.Authorizer
    wrapcheck:
      # grpc-go's own status.Error/Errorf already produce a self-describing
      # error (code + message) that is the correct thing to return directly
      # from a gRPC service method — see pkg/domain/kms. Wrapping it with
      # fmt.Errorf would double the "rpc error: code = ... desc = ..."
      # envelope into the status message itself, since grpc-go's
      # status.FromError takes an errors.As-found wrapped status's Proto but
      # sets its Message to the wrapping error's full Error() string.
      extra-ignore-sigs:
        - status.Error(
        - status.Errorf(

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
