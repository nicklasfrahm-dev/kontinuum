# Avoid issues with incorrect JSON schema.
#:schema none
root = "."
tmp_dir = "/tmp/kontinuum-air"

[build]
  # `make build` (rather than a raw go build) so every hot-reload rebuild
  # also runs the `generate` prerequisite that vendors Tailwind/HTMX/Prism
  # into pkg/ui/assets/vendor (see Makefile and pkg/ui/assets.go) — those
  # assets are gitignored, so without this the embedded UI would 404 on a
  # fresh checkout. args_bin (rather than appending "serve" onto
  # entrypoint/full_bin as one string) is load-bearing: air only
  # shell-splits full_bin, not entrypoint, and an absolute entrypoint path
  # with an appended arg fails with a confusing "not found" since it's run
  # as a single, unsplit argv[0].
  entrypoint = "/app/bin/kontinuum"
  args_bin = ["serve"]
  # GOFLAGS=-buildvcs=false (read by every `go` subcommand make build runs —
  # go tool, go generate's go run, and the final go build) since the
  # bind-mounted .git here is owned by the host UID, not this container's,
  # and go's VCS stamping refuses to read a repo it doesn't trust the
  # ownership of ("dubious ownership"). Scoped to air only, via the
  # environment rather than the Makefile, since a plain host checkout (or
  # the Containerfile's fresh COPY) doesn't hit this and loses nothing by
  # skipping it.
  cmd = "GOFLAGS=-buildvcs=false make build"
  delay = 1000
  # config/crd, pkg/ui/assets/vendor, and zz_generated.deepcopy.go are build
  # *output*, not input — `generate` (a `build` prerequisite, see above)
  # rewrites all of them on every single rebuild regardless of whether
  # their content actually changed. Without these excludes, such a rewrite
  # touching a watched file would make air pick it up as a new change and
  # rebuild again, rewriting them again, forever.
  exclude_dir = ["bin", "vendor", "config/crd", "pkg/ui/assets/vendor"]
  exclude_regex = ["_test.go", "zz_generated"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = ["."]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
  kill_delay = "2s"
  log = "/tmp/kontinuum-air/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
