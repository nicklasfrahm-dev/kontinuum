site_name: Kontinuum
site_description: A Kubernetes-style API server built on kommodity's libkapi
site_url: https://nicklasfrahm-dev.github.io/kontinuum/
repo_name: nicklasfrahm-dev/kontinuum
repo_url: https://github.com/nicklasfrahm-dev/kontinuum
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    logo: material/hexagon-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Overview:
      - Welcome: index.md
      - Architecture: architecture.md
  - Quickstart:
      - Running via Docker: running-via-docker.md
  - Admin Guide:
      - Authentication: authentication.md
      - Cluster provisioning: workflows/cluster-provisioning.md
      - Zone join: workflows/zone-join.md
  - Developer guide:
      - Contribution guidelines: contributing.md
      - Local setup: local-setup.md
  - Reference:
      - API reference: reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nicklasfrahm-dev/kontinuum
