services:
  # PostgreSQL database — shared by all profiles.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontinuum
      POSTGRES_PASSWORD: kontinuum
      POSTGRES_DB: kontinuum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontinuum -d kontinuum"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Development mode with air hot reloading.
  kontinuum-dev:
    profiles: ["dev"]
    image: cosmtrek/air:latest
    working_dir: /app
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KONTINUUM_SERVER_ADDR: ":8080"
      KONTINUUM_SERVER_STORAGE: "postgres://kontinuum:kontinuum@postgres:5432/kontinuum?sslmode=disable"
      KONTINUUM_LOG_LEVEL: "info"
      KONTINUUM_LOG_FORMAT: "console"
      KONTINUUM_SERVER_DNS_DOMAIN: "kontinuum.localhost"
      # A joined zone's own kontinuum-server (running inside the "talos"
      # profile's downstream cluster — see that service's own comment)
      # reaches this hub's etcd gRPC proxy through this address, from a
      # pod's own network namespace — not a Docker Compose service name,
      # which Talos's own OS manages its own DNS resolution independently
      # of (it does not use Docker's embedded DNS), so a hostname here
      # wouldn't resolve there. kontinuum-dev's own static IP (see the
      # "default" network below) is reachable directly instead, since the
      # downstream cluster's pod network sits on that same Docker bridge.
      KONTINUUM_SERVER_GRPC_ENDPOINT: "172.28.0.10:8080"
      GOTOOLCHAIN: auto
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10

  # A single-node Talos "cluster" — real Talos OS running in container
  # mode (not a VM), the same shape the taloscluster/instance packages'
  # own e2e tests boot — for exercising kontinuum's full zone-bootstrap
  # flow locally end to end: `kontinuum zone add --talos-address
  # 172.28.0.20 ...` (see docs/local-setup.md). Its own docker run shape
  # (privileged, host cgroup namespace, tmpfs for /run|/system|/tmp,
  # anonymous volumes for the directories Talos's container-mode init
  # expects writable) mirrors
  # pkg/domain/taloscluster/e2e_test.go's startTalosContainer.
  talos:
    profiles: ["dev"]
    image: ghcr.io/siderolabs/talos:v1.13.0
    privileged: true
    cgroup: host
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    tmpfs:
      - /run
      - /system
      - /tmp
    volumes:
      - talos_state:/system/state
      - talos_var:/var
      - talos_etc_cni:/etc/cni
      - talos_etc_kubernetes:/etc/kubernetes
      - talos_libexec_kubernetes:/usr/libexec/kubernetes
      - talos_opt:/opt
    networks:
      # A static IP, not the Compose service name: post-bootstrap, Talos
      # issues its own server certificate scoped to its detected hostname
      # and addresses, not to whatever name a caller happened to dial it
      # by, so reaching it as "talos" (Docker's own embedded-DNS name for
      # this service) fails TLS hostname verification the instant it
      # leaves maintenance mode ("certificate is valid for
      # <node-hostname>, not talos") — dialing its own IP instead avoids
      # that entirely, the same way a real bare-metal node is always
      # addressed by IP, never by name, in `kontinuum zone add
      # --talos-address`.
      default:
        ipv4_address: 172.28.0.20

  # Self-signed TLS termination in front of kontinuum-dev. kubectl (via
  # client-go) refuses to send the bearer token that the oidc-login exec
  # plugin produces (see pkg/ui/kubeconfig.go) over a plaintext connection,
  # so authenticated kubectl access needs an HTTPS endpoint even in local
  # development.
  proxy:
    profiles: ["dev"]
    image: caddy:2-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
    ports:
      - "8443:8443"
    depends_on:
      - kontinuum-dev

networks:
  # A fixed subnet so kontinuum-dev can be given a static IP (see its own
  # KONTINUUM_SERVER_GRPC_ENDPOINT/networks above) — the one address the
  # "talos" profile's downstream cluster can reliably reach the hub at.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  caddy_data:
  talos_state:
  talos_var:
  talos_etc_cni:
  talos_etc_kubernetes:
  talos_libexec_kubernetes:
  talos_opt:

configs:
  caddyfile:
    # A bare "localhost:8443 { ... }" address (rather than ":8443") is load-
    # bearing: it makes Caddy obtain the self-signed certificate up front at
    # startup, which is a well-exercised code path. A hostless ":8443" only
    # tries to obtain one on-demand on the first handshake, which reliably
    # fails with a generic "internal error" TLS alert in this environment.
    content: |
      localhost:8443 {
      	tls internal

      	reverse_proxy kontinuum-dev:8080
      }
