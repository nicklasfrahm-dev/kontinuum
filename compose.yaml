services:
  # PostgreSQL database — shared by all profiles.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontinuum
      POSTGRES_PASSWORD: kontinuum
      POSTGRES_DB: kontinuum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontinuum -d kontinuum"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Development mode with air hot reloading.
  kontinuum-dev:
    profiles: ["dev"]
    image: cosmtrek/air:latest
    working_dir: /app
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KONTINUUM_SERVER_ADDR: ":8080"
      KONTINUUM_SERVER_STORAGE: "postgres://kontinuum:kontinuum@postgres:5432/kontinuum?sslmode=disable"
      KONTINUUM_LOG_LEVEL: "info"
      KONTINUUM_LOG_FORMAT: "console"
      # A joined zone's own kontinuum-server (running inside the "talos"
      # profile's downstream cluster's pod network, which sits on this same
      # Docker bridge) reaches this hub's etcd gRPC proxy through this
      # address, resolved via Docker Compose's own embedded DNS. Points at
      # the proxy service's own 8443, not kontinuum-dev's plain-HTTP 8080
      # directly: a real deployment's endpoint always terminates TLS (see
      # proxy's own doc), and etcdproxy.Relay requires it unless
      # InsecureSkipVerify is also set (see
      # KONTINUUM_SERVER_GRPC_INSECURE_TLS_SKIP_VERIFY below) — dev stays
      # representative of that, rather than dialing kontinuum-dev's own
      # plaintext port, which a real deployment never exposes this way.
      KONTINUUM_SERVER_GRPC_ENDPOINT: "proxy:8443"
      # proxy's own certificate is self-signed (see its own "tls internal"
      # config below) — no client trusts it by default, so the relay this
      # endpoint drives would otherwise fail certificate verification on
      # every call. Real deployments never set this: Endpoint there
      # terminates TLS with a certificate the zone's own root CA set
      # already trusts.
      KONTINUUM_SERVER_GRPC_INSECURE_TLS_SKIP_VERIFY: "true"
      # Zones are published under this domain, hosted by the pdns service
      # below. Overridable from .env, but pdns creates whatever zone this
      # resolves to, so the two always agree.
      KONTINUUM_SERVER_DNS_DOMAIN: ${KONTINUUM_SERVER_DNS_DOMAIN:-kontinuum.test}
      # Each zone's external-dns publishes its records to pdns. The
      # credential is flat YAML whose keys become external-dns env vars (see
      # docs/workflows/zone-add.md); external-dns reads every flag from an
      # EXTERNAL_DNS_<FLAG> env var, so these set --pdns-server/--pdns-api-key.
      KONTINUUM_SERVER_DNS_PROVIDER: PowerDNS
      KONTINUUM_SERVER_DNS_CREDENTIAL: |
        EXTERNAL_DNS_PDNS_SERVER: http://pdns:8081
        EXTERNAL_DNS_PDNS_API_KEY: kontinuum
      # Each zone's cert-manager requests its certificate from pebble below
      # instead of Let's Encrypt, which could never validate a zone on this
      # private network. Pebble's API certificate comes from its own test CA,
      # which cert-manager doesn't trust — hence skipping verification. Real
      # deployments never set this.
      KONTINUUM_ACME_SERVER: https://pebble:14000/dir
      KONTINUUM_ACME_INSECURE_SKIP_VERIFY: "true"
      GOTOOLCHAIN: auto
    depends_on:
      postgres:
        condition: service_healthy

  # A single-node Talos "cluster" — real Talos OS running as a QEMU/KVM VM
  # (see hack/talos-qemu) — for exercising kontinuum's full zone-bootstrap
  # flow locally end to end: `kontinuum zone add --talos-address talos
  # ...` (see docs/local-setup.md — "talos", the Compose service name, is
  # resolved to this container's own IP by zone.Add itself before it's
  # ever stored; see instancedomain.ResolveAddress). Deliberately not the
  # Docker container-mode image pkg/domain/taloscluster's own e2e tests
  # use: Talos's runtime.ModeContainer Reset sequence never wipes disks or
  # reboots, no matter how it's called — a structural limitation of that
  # image, not a kontinuum bug (see hack/talos-qemu/entrypoint.sh's own
  # doc) — so a container-mode node can never actually be reset back to
  # maintenance mode locally the way `zone remove` expects. Requires
  # /dev/kvm (hardware virtualization) on the Docker host.
  talos:
    profiles: ["dev"]
    build:
      context: hack/talos-qemu
      dockerfile: Containerfile
    privileged: true
    # Lets the cluster resolve the zone hostnames external-dns publishes to
    # pdns — cert-manager's HTTP-01 self-check needs that before it asks
    # pebble to issue (see hack/talos-qemu/entrypoint.sh).
    environment:
      DNS_FORWARD_DOMAIN: ${KONTINUUM_SERVER_DNS_DOMAIN:-kontinuum.test}
      DNS_FORWARD_HOST: pdns
    volumes:
      - talos_disk:/data
    depends_on:
      - pdns

  # Authoritative DNS for the zones' domain, with the HTTP API each zone's
  # external-dns writes records through. Records aren't persisted: the
  # zones' DNSEndpoints are the source of truth, and external-dns republishes
  # them within a minute of pdns restarting. The zone's SOA sets a 30s
  # negative-caching TTL instead of PowerDNS's default 3600s: a zone's
  # hostname is looked up (by cert-manager's HTTP-01 self-check) before
  # external-dns has published it, and resolvers would otherwise keep that
  # "doesn't exist" answer for an hour. Query it from the host with
  # `dig @127.0.0.1 -p 1053 <zone>.<region>.kontinuum.test`.
  pdns:
    profiles: ["dev"]
    image: powerdns/pdns-auth-51:5.1.4
    environment:
      PDNS_AUTH_API_KEY: kontinuum
      DNS_DOMAIN: ${KONTINUUM_SERVER_DNS_DOMAIN:-kontinuum.test}
    entrypoint:
      - sh
      - -c
      - >-
        echo "default-soa-content=ns1.@ hostmaster.@ 0 10800 3600 604800 30"
        > /etc/powerdns/pdns.d/zz-soa.conf
        && { pdnsutil zone list "$$DNS_DOMAIN" >/dev/null 2>&1
        || pdnsutil zone create "$$DNS_DOMAIN" "ns1.$$DNS_DOMAIN"; }
        && exec /usr/bin/tini -- /usr/local/sbin/pdns_server-startup
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"

  # Pebble, Let's Encrypt's ACME test server, issuing each zone's
  # certificate. PEBBLE_VA_ALWAYS_VALID skips challenge validation (so it
  # never has to reach into the zone's network); the other two turn off
  # Pebble's deliberate nonce rejection and random delays, which only add
  # noise here. Pebble generates a new root CA on every start, so browsers
  # won't trust a zone's certificate unless you import the current one:
  # `curl -k https://localhost:15000/roots/0`.
  pebble:
    profiles: ["dev"]
    image: ghcr.io/letsencrypt/pebble:2.10.1
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    ports:
      - "15000:15000"

  # Self-signed TLS termination in front of kontinuum-dev. kubectl (via
  # client-go) refuses to send the bearer token that the oidc-login exec
  # plugin produces (see pkg/ui/kubeconfig.go) over a plaintext connection,
  # so authenticated kubectl access needs an HTTPS endpoint even in local
  # development.
  proxy:
    profiles: ["dev"]
    image: caddy:2-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
    ports:
      - "8443:8443"
    depends_on:
      - kontinuum-dev

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  caddy_data:
  talos_disk:

configs:
  caddyfile:
    # A bare "localhost:8443, proxy:8443 { ... }" address list (rather than
    # ":8443") is load-bearing: it makes Caddy obtain the self-signed
    # certificate up front at startup, which is a well-exercised code path.
    # A hostless ":8443" only tries to obtain one on-demand on the first
    # handshake, which reliably fails with a generic "internal error" TLS
    # alert in this environment. Both addresses are listed, not just
    # "localhost:8443", because grpc-go's default TLS credentials set SNI to
    # the dial target's own host — KONTINUUM_SERVER_GRPC_ENDPOINT dials
    # "proxy:8443" (see kontinuum-dev's own doc), so that connection's SNI
    # is "proxy", not "localhost"; without "proxy" listed here too, Caddy
    # has no site matching that SNI and the handshake fails outright,
    # before this site block's certificate is even offered.
    # transport http { versions h2c 2 } is load-bearing for the gRPC traffic
    # KONTINUUM_SERVER_GRPC_ENDPOINT now sends through this proxy (see
    # kontinuum-dev's own doc): kontinuum-dev:8080 speaks h2c (cleartext
    # HTTP/2), which gRPC's own streaming/trailers semantics require, but
    # Caddy's reverse_proxy defaults to plain HTTP/1.1 for a non-TLS
    # upstream unless told otherwise — silently downgrading every relayed
    # gRPC call to a protocol it can't actually run over. h2c still serves
    # regular HTTP/UI traffic through this same proxy unchanged.
    content: |
      localhost:8443, proxy:8443 {
      	tls internal

      	reverse_proxy kontinuum-dev:8080 {
      		transport http {
      			versions h2c 2
      		}
      	}
      }
