name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run code generators
        run: go generate ./...

      - name: Resolve golangci-lint version
        id: golangci-lint-version
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}

  validate-code-generation:
    name: Validate code generation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Scoped to ./api/... — the only go:generate directives that matter
      # here are controller-gen's (deepcopy methods and config/crd
      # manifests, see api/v1alpha1/doc.go and api/v1alpha2/doc.go).
      # pkg/ui/assets.go's directive fetches vendored web assets from a CDN
      # and is gitignored (see .gitignore), so it has nothing to validate
      # here and would only add network flakiness.
      - name: Run code generators
        run: GOOS= GOARCH= go generate ./api/...

      - name: Fail if generated code is out of date
        run: |
          git add -A api/ config/crd/
          if ! git diff --cached --exit-code -- api/ config/crd/; then
            echo "::error::Generated code (deepcopy methods, config/crd manifests) is out of date. Run 'make generate' and commit the result."
            exit 1
          fi

  test:
    name: Test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run code generators
        run: go generate ./...

      - name: Run tests with coverage
        uses: nicklasfrahm-dev/go-coverage-action@c98422f704df2fcf76ae75e0f97dd6c482b4f504 # v2.0.5
        with:
          cover-pkg: ./...
          cover-mode: atomic
          test-args: '["-race"]'

  build-docs:
    name: Build docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      # mkdocs-material emits some root-relative links (e.g. /reference/).
      # --root-dir tells lychee those resolve against the built site itself,
      # since docs.kontinuum.sh serves it at the domain root. mkdocs' own
      # site_url also makes it emit some links as fully-qualified
      # https://docs.kontinuum.sh/... URLs (e.g. sitemap.xml, canonical
      # link tags) — --root-dir doesn't catch those (it only rewrites
      # root-relative paths), so --remap sends them to this same local
      # build instead of the live site, which a PR adding a brand-new page
      # would otherwise 404 against until merged and deployed.
      #
      # --max-retries/--retry-wait-time only cover lychee's own notion of a
      # transient failure (e.g. a timeout once connected). A "Connection
      # failed" (refused/DNS/no route) is classified as permanent and is
      # never retried internally, no matter how high those flags are set -
      # see https://lychee.cli.rs/troubleshooting/network-errors/. That kept
      # slipping through against otherwise-reliable hosts and failing PR
      # builds even after raising the flags (#98/#99), so the whole check
      # below is wrapped in a shell retry loop instead. lycheeverse/lychee-
      # action can't be reused for this: it's a composite action, and the
      # available step-retry actions (Wandalen/wretry.action,
      # nick-fields/retry) only support wrapping shell commands or
      # JS/Docker actions, not composite ones - so lychee is installed and
      # invoked directly here.
      - name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          curl -sfL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/lychee"
          install -t "$RUNNER_TEMP/lychee/bin" -D "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu/lychee"
          echo "$RUNNER_TEMP/lychee/bin" >> "$GITHUB_PATH"

      - name: Check for broken links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempts=3
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            lychee --no-progress --exclude-loopback --root-dir "${{ github.workspace }}/site" \
              --remap "https://docs.kontinuum.sh file://${{ github.workspace }}/site" \
              --max-retries 5 --retry-wait-time 5 \
              site && exit 0
            status=$?
            if ((attempt < attempts)); then
              echo "::warning::Link check failed (attempt ${attempt}/${attempts}, exit ${status}); retrying in 10s"
              sleep 10
            fi
          done
          exit "$status"

  e2e:
    name: E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run gated end-to-end tests
        run: make test-e2e

  containerize:
    name: Containerize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Create semantic-release config
        if: github.event_name != 'pull_request'
        run: |
          cat <<'EOF' > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              ["@semantic-release/exec", {
                "generateNotesCmd": "echo ${nextRelease.version} > /tmp/semantic-release-next-version.txt"
              }],
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Determine VERSION
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eou pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION=$(git describe --tags --always)
          else
            rm -f /tmp/semantic-release-next-version.txt
            npx --min-release-age=15 -p semantic-release -p @semantic-release/exec -- semantic-release --dry-run
            if [[ -s /tmp/semantic-release-next-version.txt ]]; then
              VERSION="v$(cat /tmp/semantic-release-next-version.txt)"
            else
              VERSION=$(git describe --tags --always)
            fi
          fi
          echo "Resolved VERSION: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

  release:
    name: Release
    needs: containerize
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Create semantic-release config
        run: |
          cat <<'EOF' > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              ["@semantic-release/exec", {
                "generateNotesCmd": "echo ${nextRelease.version} > /tmp/semantic-release-next-version.txt"
              }],
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --min-release-age=15 -p semantic-release -p @semantic-release/exec -- semantic-release

  deploy:
    name: Deploy
    needs: [containerize, release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy to production
        uses: nicklasfrahm-dev/platform/actions/deploy@main
        with:
          service: kontinuum
          environment: prd
          tag: ${{ needs.containerize.outputs.version }}
          github-ssh-key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
